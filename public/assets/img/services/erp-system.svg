<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 667" fill="none">
  <title>ERP system: one hub connecting finance, inventory, HR, sales, purchasing and manufacturing</title>
  <rect width="1000" height="667" fill="#fff"/>
  <g fill="#dbe8fb">
    <path d="M110 110c0-20 16-36 36-36 13 0 24 7 30 17 4-2 8-3 13-3 16 0 29 13 29 29H110z"/>
    <path d="M760 80c0-18 15-33 33-33 12 0 22 6 28 15 3-1 7-2 11-2 15 0 27 12 27 27H760z"/>
  </g>
  <ellipse cx="500" cy="610" rx="360" ry="16" fill="#eef3fb"/>

  <!-- connectors -->
  <g stroke="#9cc3ff" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round">
    <path d="M500 330L250 170M500 330L750 170M500 330L180 340M500 330L820 340M500 330L265 500M500 330L735 500"/>
  </g>

  <!-- hub -->
  <circle cx="500" cy="330" r="128" fill="#eaf3ff"/>
  <circle cx="500" cy="330" r="96" fill="#157efb"/>
  <circle cx="500" cy="330" r="96" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="500" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="46" fill="#fff" letter-spacing="2">ERP</text>
  <rect x="452" y="360" width="96" height="8" rx="4" fill="#fff" opacity=".45"/>

  <!-- module cards -->
  <!-- Finance -->
  <g transform="translate(160 118)">
    <rect width="180" height="100" rx="16" fill="#fff" stroke="#dde6f5" stroke-width="2"/>
    <rect x="16" y="18" width="48" height="48" rx="12" fill="#2ecc8f"/>
    <text x="40" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#fff">$</text>
    <text x="78" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#0b1531">Finance</text>
    <rect x="78" y="52" width="80" height="8" rx="4" fill="#c9d6ee"/>
    <rect x="16" y="78" width="148" height="8" rx="4" fill="#eef3fb"/><rect x="16" y="78" width="96" height="8" rx="4" fill="#2ecc8f"/>
  </g>
  <!-- Inventory -->
  <g transform="translate(660 118)">
    <rect width="180" height="100" rx="16" fill="#fff" stroke="#dde6f5" stroke-width="2"/>
    <rect x="16" y="18" width="48" height="48" rx="12" fill="#f6c463"/>
    <path d="M28 34l12-7 12 7v16l-12 7-12-7z" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M28 34l12 7 12-7M40 41v16" stroke="#fff" stroke-width="3"/>
    <text x="78" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#0b1531">Inventory</text>
    <rect x="78" y="52" width="80" height="8" rx="4" fill="#c9d6ee"/>
    <rect x="16" y="78" width="148" height="8" rx="4" fill="#eef3fb"/><rect x="16" y="78" width="120" height="8" rx="4" fill="#f6c463"/>
  </g>
  <!-- HR -->
  <g transform="translate(60 290)">
    <rect width="180" height="100" rx="16" fill="#fff" stroke="#dde6f5" stroke-width="2"/>
    <rect x="16" y="18" width="48" height="48" rx="12" fill="#ff6b8a"/>
    <circle cx="40" cy="36" r="8" fill="#fff"/><path d="M26 58c2-10 26-10 28 0" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#0b1531">HR</text>
    <rect x="78" y="52" width="80" height="8" rx="4" fill="#c9d6ee"/>
    <rect x="16" y="78" width="148" height="8" rx="4" fill="#eef3fb"/><rect x="16" y="78" width="70" height="8" rx="4" fill="#ff6b8a"/>
  </g>
  <!-- Sales -->
  <g transform="translate(760 290)">
    <rect width="180" height="100" rx="16" fill="#fff" stroke="#dde6f5" stroke-width="2"/>
    <rect x="16" y="18" width="48" height="48" rx="12" fill="#157efb"/>
    <path d="M26 56l10-12 8 6 12-16" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#0b1531">Sales</text>
    <rect x="78" y="52" width="80" height="8" rx="4" fill="#c9d6ee"/>
    <rect x="16" y="78" width="148" height="8" rx="4" fill="#eef3fb"/><rect x="16" y="78" width="132" height="8" rx="4" fill="#157efb"/>
  </g>
  <!-- Purchasing -->
  <g transform="translate(175 456)">
    <rect width="180" height="100" rx="16" fill="#fff" stroke="#dde6f5" stroke-width="2"/>
    <rect x="16" y="18" width="48" height="48" rx="12" fill="#6640f4"/>
    <path d="M26 30h6l6 20h16l4-14H36" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="57" r="3" fill="#fff"/><circle cx="52" cy="57" r="3" fill="#fff"/>
    <text x="78" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#0b1531">Purchasing</text>
    <rect x="78" y="52" width="80" height="8" rx="4" fill="#c9d6ee"/>
    <rect x="16" y="78" width="148" height="8" rx="4" fill="#eef3fb"/><rect x="16" y="78" width="88" height="8" rx="4" fill="#6640f4"/>
  </g>
  <!-- Manufacturing -->
  <g transform="translate(645 456)">
    <rect width="180" height="100" rx="16" fill="#fff" stroke="#dde6f5" stroke-width="2"/>
    <rect x="16" y="18" width="48" height="48" rx="12" fill="#0b1531"/>
    <circle cx="40" cy="42" r="10" stroke="#4fe0ff" stroke-width="4"/>
    <path d="M40 26v-4M40 62v-4M24 42h-4M60 42h-4M29 31l-3-3M54 56l-3-3M29 53l-3 3M54 28l-3 3" stroke="#4fe0ff" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#0b1531">Manufacturing</text>
    <rect x="78" y="52" width="80" height="8" rx="4" fill="#c9d6ee"/>
    <rect x="16" y="78" width="148" height="8" rx="4" fill="#eef3fb"/><rect x="16" y="78" width="110" height="8" rx="4" fill="#0b1531"/>
  </g>
  <g fill="#f6c463"><circle cx="930" cy="200" r="6"/><circle cx="70" cy="470" r="5"/><circle cx="600" cy="150" r="4"/></g>
</svg>
