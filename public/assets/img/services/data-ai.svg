    <rect x="262" y="362" width="22" height="88" rx="3" fill="#7fb4ff"/>
    <rect x="296" y="340" width="22" height="110" rx="3"/>
    <rect x="330" y="372" width="22" height="78" rx="3" fill="#7fb4ff"/>
    <rect x="364" y="318" width="22" height="132" rx="3"/>
    <rect x="398" y="330" width="22" height="120" rx="3" fill="#ff6b8a"/>
