    <text x="55" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#4fe0ff">AI</text>
  </g>

  <!-- person pointing -->
  <g transform="translate(760 420)">
    <path d="M28 70l-6 104h18l10-74 10 74h18l-6-104z" fill="#1d2b55"/>
    <path d="M22 170h22v10H16z" fill="#0b1531"/><path d="M58 170h22l6 10H58z" fill="#0b1531"/>
