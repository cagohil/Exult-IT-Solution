  <rect x="470" y="292" width="184" height="176" rx="8" fill="#fff" stroke="#dde6f5"/>
  <path d="M486 440l30-34 28 14 32-48 30 18 30-52" stroke="#157efb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
