    <rect x="374" y="238" width="72" height="18" rx="5" fill="#2ecc8f"/>
    <rect x="514" y="204" width="140" height="74" rx="8" fill="#fff" stroke="#dde6f5"/>
    <rect x="528" y="218" width="60" height="8" rx="4" fill="#c9d6ee"/>
    <rect x="528" y="238" width="96" height="18" rx="5" fill="#f6c463"/>
