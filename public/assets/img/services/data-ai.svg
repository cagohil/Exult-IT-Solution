  <path d="M400 500h60l14 66h-88z" fill="#1f46a8"/>
  <rect x="350" y="562" width="160" height="14" rx="7" fill="#2a5bd7"/>

  <!-- neural network panel -->
  <g>
    <rect x="640" y="250" width="230" height="230" rx="22" fill="#0b1531"/>
    <g stroke="#4fe0ff" stroke-opacity=".55" stroke-width="2">
