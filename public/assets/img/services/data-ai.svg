  <rect x="186" y="186" width="488" height="298" rx="6" fill="#f5f8ff"/>
  <circle cx="200" cy="168" r="5" fill="#ff6b8a"/><circle cx="216" cy="168" r="5" fill="#f6c463"/><circle cx="232" cy="168" r="5" fill="#2ecc8f"/>
